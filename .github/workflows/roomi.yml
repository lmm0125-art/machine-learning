name: roomi

on:
  push:
    branches: [main]
    paths:
      - "roomi/**"
      - ".github/workflows/roomi.yml"
  pull_request:
    paths:
      - "roomi/**"

defaults:
  run:
    working-directory: roomi

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: roomi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          node --check public/app.js

      - name: package.json is valid
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
